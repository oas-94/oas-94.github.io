<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    /* Ingen bakgrunn. Bokstaven bytter farge etter om nettleseren
       står i lys eller mørk modus, så den er synlig i begge. */
    .glyf{ fill:none; stroke:#111111; }
    @media (prefers-color-scheme: dark){
      .glyf{ stroke:#f2f2f2; }
    }
  </style>

  <!-- Ovalen: høyere enn bred, som en bokstav og ikke en sirkel -->
  <ellipse class="glyf" cx="16" cy="16" rx="9.4" ry="11.4" stroke-width="4.2"/>

  <!-- Streken: tynnere enn ovalen, brattere enn 45 grader, kort overheng -->
  <line class="glyf" x1="8.5" y1="25.5" x2="23.5" y2="6.5" stroke-width="3.1"/>
</svg>
