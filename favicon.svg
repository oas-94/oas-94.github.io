<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    /* Bokstaven settes med skrift i stedet for å tegnes, så den får
       riktige proporsjoner og skarpe kanter. Ingen bakgrunn: fargen
       følger om nettleseren står i lys eller mørk modus. */
    text{
      font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
      font-weight: 600;
      font-size: 30px;
      fill: #111111;
    }
    @media (prefers-color-scheme: dark){
      text{ fill: #f2f2f2; }
    }
  </style>

  <text x="16" y="16" text-anchor="middle" dominant-baseline="central">Ø</text>
</svg>
